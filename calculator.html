<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماشین حساب</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.calculator {
    background: #fff;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 350px;
}
.display {
    background: #f5f5f5;
    border-radius: 10px;
    padding: 20px;
    text-align: left;
    direction: ltr;
    margin-bottom: 20px;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.history {
    font-size: 14px;
    color: #999;
    min-height: 20px;
    word-wrap: break-word;
}
.result {
    font-size: 32px;
    color: #333;
    font-weight: bold;
    word-wrap: break-word;
}
.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}
button {
    padding: 20px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}
.number { background: #f0f0f0; color: #333; }
.operator { background: #667eea; color: #fff; }
.equal { background: #764ba2; color: #fff; grid-column: span 2; }
.clear { background: #ff6b6b; color: #fff; }
.zero { grid-column: span 2; }
</style>
</head>
<body>
<div class="calculator">
    <div class="display">
        <div class="history" id="history"></div>
        <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
        <button class="clear" onclick="clearAll()">C</button>
        <button class="operator" onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="appendOperator('%')">%</button>
        <button class="operator" onclick="appendOperator('/')">÷</button>
        
        <button class="number" onclick="appendNumber('7')">7</button>
        <button class="number" onclick="appendNumber('8')">8</button>
        <button class="number" onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('*')">×</button>
        
        <button class="number" onclick="appendNumber('4')">4</button>
        <button class="number" onclick="appendNumber('5')">5</button>
        <button class="number" onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="appendOperator('-')">-</button>
        
        <button class="number" onclick="appendNumber('1')">1</button>
        <button class="number" onclick="appendNumber('2')">2</button>
        <button class="number" onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="appendOperator('+')">+</button>
        
        <button class="number zero" onclick="appendNumber('0')">0</button>
        <button class="number" onclick="appendNumber('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let currentInput = '0';
    let historyText = '';

    function updateDisplay() {
        document.getElementById('result').textContent = currentInput;
        document.getElementById('history').textContent = historyText;
    }

    function appendNumber(num) {
        if (currentInput === '0' && num !== '.') {
            currentInput = num;
        } else {
            currentInput += num;
        }
        updateDisplay();
    }

    function appendOperator(op) {
        if (currentInput !== '0' || historyText !== '') {
            historyText += currentInput + ' ' + op + ' ';
            currentInput = '0';
            updateDisplay();
        }
    }

    function calculate() {
        try {
            let expression = historyText + currentInput;
            expression = expression.replace(/×/g, '*').replace(/÷/g, '/');
            let result = eval(expression);
            
            if (!isFinite(result)) {
                currentInput = 'خطا';
                historyText = '';
            } else {
                historyText = expression + ' =';
                currentInput = result.toString();
            }
        } catch (e) {
            currentInput = 'خطا';
            historyText = '';
        }
        updateDisplay();
    }

    function clearAll() {
        currentInput = '0';
        historyText = '';
        updateDisplay();
    }

    function deleteLast() {
        if (currentInput.length > 1) {
            currentInput = currentInput.slice(0, -1);
        } else {
            currentInput = '0';
        }
        updateDisplay();
    }

    updateDisplay();
</script>
</body>
</html>

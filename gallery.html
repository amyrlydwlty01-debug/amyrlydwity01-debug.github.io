<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گالری تصاویر | امیرعلی دولتی</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
}
h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 28px;
}
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
    max-width: 1000px;
    margin: 0 auto;
}
.gallery-item {
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}
.gallery-item:hover {
    transform: scale(1.03);
}
.gallery-item img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
}
.gallery-item p {
    padding: 15px;
    text-align: center;
    font-size: 14px;
}
.back-btn {
    display: block;
    text-align: center;
    margin-top: 30px;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
}
</style>
</head>
<body>
<h1>🖼️ گالری تصاویر</h1>
<div class="gallery">
    <!-- نمونه عکس ۱ -->
    <div class="gallery-item">
        <img src="https://github.com/amyrlydwity01-debug.png" alt="عکس پروفایل">
        <p>عکس پروفایل من</p>
    </div>
    <!-- نمونه عکس ۲ -->
    <div class="gallery-item">
        <img src="https://picsum.photos/400/300" alt="عکس نمونه">
        <p>عکس نمونه</p>
    </div>
    <!-- نمونه عکس ۳ -->
    <div class="gallery-item">
        <img src="https://picsum.photos/401/300" alt="عکس نمونه">
        <p>عکس نمونه</p>
    </div>
</div>

<a href="index.html" class="back-btn">⬅️ بازگشت به صفحه اصلی</a>
</body>
</html>
